version: '3.8'

services:
  ml-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arogya-ml-backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173,https://arogyasahayak.vercel.app
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
